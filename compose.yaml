services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    # 只绑本机回环：app 用 host 网络后无法再靠容器名 "postgres" 解析，改用 127.0.0.1:5432
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build:
      context: .
      network: host
      # 如果你所在的网络环境需要代理才能拉取基础镜像/依赖，取消下面两行注释并改成你自己的代理地址
      # args:
      #   HTTP_PROXY: http://127.0.0.1:7890
      #   HTTPS_PROXY: http://127.0.0.1:7890
    container_name: job-bot-app
    env_file:
      - /etc/job-bot/job-bot.env
    user: "${JOB_BOT_UID:-1000}:${JOB_BOT_GID:-1000}"
    # host 网络：如果 LLM 网关、Telegram 代理等依赖服务跑在宿主机上，
    # 用 host 网络最简单；也可以改成桥接网络 + 显式端口，看你自己的部署方式。
    network_mode: host
    volumes: [./data:/app/data]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
  telegram:
    build:
      context: .
      network: host
    env_file:
      - /etc/job-bot/job-bot.env
    network_mode: host
    volumes: [./data:/app/data]
    profiles: [telegram]
volumes:
  postgres_data:
